<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyric Arcade</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1618; }
      body { display: grid; place-items: center; }
      #stage { width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
      #stage canvas { image-rendering: pixelated; display: block; }
    </style>
  </head>
  <body>
    <div id="stage" role="application" aria-label="Pyric Arcade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
