<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyric Games</title>
    <style>
      :root {
        --bg: #2b2540;
        --panel: #f9f5ef;
        --ink: #1c1618;
        --muted: #6b6480;
        --accent: #a13d3b;
        --line: #8a8fc4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--panel);
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main {
        display: grid;
        grid-template-columns: minmax(256px, 512px) 240px;
        gap: 24px;
        padding: 16px;
        width: 100%;
        max-width: 800px;
      }
      @media (max-width: 640px) {
        main { grid-template-columns: 1fr; }
      }
      #stage { aspect-ratio: 1; width: 100%; }
      #stage canvas { image-rendering: pixelated; }
      aside { display: grid; gap: 12px; align-content: start; }
      h1 { margin: 0; font-size: 16px; }
      .who { color: var(--line); font-size: 12px; }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 2px solid var(--line);
        padding: 6px 10px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .error { color: #f0a0a0; min-height: 1.4em; }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"></div>
      <aside>
        <h1>Tic-Tac-Toe</h1>
        <div class="who" id="who">Signing in…</div>
        <div id="match-controls">
          <button id="new-match" disabled>New match</button>
        </div>
        <section>
          <div class="hint">Open matches</div>
          <ul id="open-matches"></ul>
        </section>
        <div class="error" id="error" role="status"></div>
        <p class="hint">Open a second tab to play the other seat.</p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
